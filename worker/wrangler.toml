# api.lostmansriver.com: analytics, purchase keys, progress sync, restore, protected audio.
# Deploy from this folder:  npx wrangler deploy
# Secrets (set with `npx wrangler secret put NAME`, never in this file):
#   STRIPE_WEBHOOK_SECRET  whsec_… from the Stripe webhook endpoint
#   STRIPE_SECRET_KEY      a restricted key with Checkout Sessions: Read (optional, makes the
#                          welcome page instant even if the webhook is a few seconds late)
#   ADMIN_KEY              for POST /admin/issue (comps, reviewers, tests)
#   RESEND_API_KEY         re_… sending key from Resend (domain lostmansriver.com verified there)
name = "lostmans-river-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "91cf99ba149df24d16edfbc523306bc8"

routes = [{ pattern = "api.lostmansriver.com", custom_domain = true }]

[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "lostmans_events"

[[kv_namespaces]]
binding = "LR"
id = "ade6125433eb40cb8f3d6fb6950eb631"

# Chapters 2–23 (R2 enabled and uploaded 2026-10-21). Re-upload one with:
#   npx wrangler r2 object put lostmans-audio/ch-NN.mp3 --file <mp3> --content-type audio/mpeg --remote
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "lostmans-audio"

# The welcome email: Cloudflare Email Sending (Workers Paid; lostmansriver.com onboarded
# 2026-10-21). Setting RESEND_API_KEY would send through Resend instead.
[[send_email]]
name = "EMAIL"

[observability]
enabled = false
